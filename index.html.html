<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Happy Birthday Jenna</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Pinyon+Script&display=swap">
<style>
:root{--bg:#e9d9c3;--ink:#3b2a22;--chip:#fff8ee;--chip-ink:#4a2f25;--accent:#c0504d;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#2a211d;--ink:#f1e4d3;--chip:#46372f;--chip-ink:#f6e9d9}}
:root[data-theme="dark"]{--bg:#2a211d;--ink:#f1e4d3;--chip:#46372f;--chip-ink:#f6e9d9}
*{box-sizing:border-box}
html,body{height:100%;margin:0;overflow:hidden}
body{background:var(--bg);color:var(--ink);font-family:system-ui,-apple-system,"Segoe UI",sans-serif;-webkit-tap-highlight-color:transparent;user-select:none}
#stage{position:absolute;inset:0;perspective:2400px;display:flex;align-items:center;justify-content:center}
#book{position:relative;width:calc(var(--w)*2);height:var(--h);transition:transform 1.1s cubic-bezier(.5,.05,.2,1);transform-style:preserve-3d}
#book.closed{transform:scale(var(--s)) translateX(calc(var(--w)/-2))}
.page{position:absolute;top:0;height:100%;width:50%;overflow:hidden}
#pageR{left:50%;box-shadow:0 10px 40px #0004}
#pageR>img.bg,#pageL>img.bg{position:absolute;inset:0;width:100%;height:100%}
#cover{position:absolute;left:50%;top:0;width:50%;height:100%;transform-origin:left center;transform-style:preserve-3d;transition:transform 1.2s cubic-bezier(.5,.05,.2,1);z-index:3;cursor:pointer}
#book:not(.closed) #cover{transform:rotateY(-180deg);cursor:default}
.face{position:absolute;inset:0;backface-visibility:hidden;-webkit-backface-visibility:hidden;box-shadow:0 10px 40px #0004}
.face img{width:100%;height:100%;display:block}
.face.back{transform:rotateY(180deg)}
#hint{position:absolute;left:0;right:0;bottom:3%;text-align:center;font:600 15px system-ui;color:#fff;text-shadow:0 1px 6px #000a;pointer-events:none;animation:pulse 2s infinite}
#book:not(.closed) #hint{display:none}
@keyframes pulse{50%{opacity:.45}}
#pageL{left:0;z-index:4;pointer-events:none;overflow:visible}
#pageL>img.bg{display:none}
#letter{position:absolute;left:15.9%;top:38.75%;width:44.1%;height:47.15%;opacity:0;cursor:pointer;transform:rotate(-1.5deg);transition:transform .7s cubic-bezier(.3,.8,.3,1),opacity .5s .9s,box-shadow .5s;box-shadow:0 2px 8px #0005;z-index:5;pointer-events:none}
#letter img{width:100%;height:100%;display:block}
#book.ready #letter{opacity:1;pointer-events:auto}
#letter.lifted{box-shadow:0 24px 60px #000a;z-index:20;transition:transform .7s cubic-bezier(.3,.8,.3,1),box-shadow .5s}
#veil{position:absolute;left:-400vw;top:-400vh;width:900vw;height:900vh;z-index:19;background:#0007;opacity:0;pointer-events:none;transition:opacity .5s}
#veil.on{opacity:1;pointer-events:auto}
#pageL{z-index:4}#pageL.top{z-index:15}
.flame{position:absolute;transform-origin:50% 100%;animation:flick .5s ease-in-out infinite alternate;pointer-events:none;will-change:transform}
.flame.b{animation-duration:.43s;animation-delay:-.2s}
.flame img{width:100%;height:100%;display:block;transform-origin:50% 100%;transition:transform .08s linear}
@keyframes flick{0%{transform:scale(1,1) rotate(-1.5deg)}100%{transform:scale(.96,1.05) rotate(1.8deg)}}
.flame.out{animation:none;transform:scale(.3,.1);opacity:0;transition:transform .5s ease-in,opacity .45s}
.smoke{position:absolute;width:5%;aspect-ratio:1;border-radius:50%;background:radial-gradient(#fffc,#fff0 70%);animation:rise 2.2s ease-out forwards;pointer-events:none}
@keyframes rise{0%{opacity:.9;transform:translate(0,0) scale(.4)}100%{opacity:0;transform:translate(25%,-420%) scale(2.6)}}
#wish{position:absolute;left:4%;right:4%;top:11%;text-align:center;opacity:0;pointer-events:none;transform:translateY(12px);transition:opacity .8s,transform .8s}
#wish.on{opacity:1;pointer-events:auto;transform:none}
#wish h2{margin:0 0 .35em;font:400 calc(var(--w)*.13)/1.05 "Pinyon Script","Snell Roundhand","Brush Script MT",cursive;color:#9b3d3a}
#wish button{font:600 calc(var(--w)*.04)/1 system-ui;padding:.7em 1.3em;border-radius:99px;border:0;background:#9b3d3a;color:#fff;cursor:pointer}
#bar{position:fixed;left:50%;bottom:calc(10px + env(safe-area-inset-bottom,0px));transform:translate(-50%,140%);display:flex;align-items:center;gap:10px;padding:8px 12px;background:var(--chip);color:var(--chip-ink);border-radius:16px;box-shadow:0 6px 24px #0004;transition:transform .5s .9s;z-index:30;max-width:96vw;font-size:13px}
#bar.on{transform:translate(-50%,0)}
#bar button,#closeBtn{font:600 13px system-ui;border:0;border-radius:99px;padding:9px 14px;background:var(--accent);color:#fff;cursor:pointer;touch-action:none}
#bar button.ghost{background:transparent;color:var(--chip-ink);border:1.5px solid currentColor}
#bar button:focus-visible,#closeBtn:focus-visible,#wish button:focus-visible{outline:3px solid #fff;outline-offset:2px;box-shadow:0 0 0 5px var(--accent)}
#meter{position:relative;width:90px;height:10px;border-radius:9px;background:#0002;overflow:hidden}
#fill{position:absolute;inset:0 auto 0 0;width:0;background:linear-gradient(90deg,#6bbf6b,#e8b03a,#d8503f)}
#mark{position:absolute;top:0;bottom:0;width:2px;background:var(--chip-ink);opacity:.6}
#msg{max-width:150px;line-height:1.2;font-size:12px}
#closeBtn{position:fixed;top:calc(10px + env(safe-area-inset-top,0px));right:10px;z-index:30;opacity:0;pointer-events:none;transition:opacity .4s}
#closeBtn.on{opacity:1;pointer-events:auto}
#confetti{position:fixed;inset:0;width:100%;height:100%;pointer-events:none;z-index:40}
@media (prefers-reduced-motion:reduce){.flame{animation:none}#hint{animation:none}}
</style></head>

<button id="closeBtn">Close card</button>
<div id="bar">
  <button id="micBtn">Use microphone</button>
  <div id="meter" title="Microphone level"><div id="fill"></div><div id="mark"></div></div>
  <button id="holdBtn" class="ghost">Hold to blow</button>
  <span id="msg">Blow on your mic, or hold the button / Space.</span>
</div>
<canvas id="confetti"></canvas>
<script>
const $=id=>document.getElementById(id);
const book=$('book'),cover=$('cover'),letter=$('letter'),veil=$('veil'),pageL=$('pageL');
const AR=2000/1414;
let W=0,H=0;
function layout(){
  const vw=innerWidth,vh=innerHeight;
  W=Math.min(vw/2,vh/AR)*.96;H=W*AR;
  const s=Math.min(vw*.9/W,vh*.88/H);
  const r=document.documentElement.style;
  r.setProperty('--w',W+'px');r.setProperty('--h',H+'px');r.setProperty('--s',s);
  if(lifted)placeLetter(true);
}
addEventListener('resize',layout);

// ---- open / close
let isOpen=false,lifted=false,readyT=null;
layout();
function openCard(){
  if(isOpen)return;isOpen=true;book.classList.remove('closed');
  $('closeBtn').classList.add('on');
  readyT=setTimeout(()=>{book.classList.add('ready');$('bar').classList.add('on')},1100);
}
function closeCard(){
  if(!isOpen)return;tuck();clearTimeout(readyT);isOpen=false;
  book.classList.remove('ready');book.classList.add('closed');
  $('closeBtn').classList.remove('on');$('bar').classList.remove('on');
}
cover.addEventListener('click',openCard);
cover.addEventListener('keydown',e=>{if(e.key==='Enter')openCard()});
$('closeBtn').onclick=closeCard;

// ---- letter lift
function placeLetter(up){
  if(!up){letter.style.transform='';return}
  const p=pageL.getBoundingClientRect();
  const lw=.441*p.width,lh=.4715*p.height;
  const bx=p.left+(.159+.441/2)*p.width,by=p.top+(.3875+.4715/2)*p.height;
  const land=innerWidth>innerHeight;
  const tx=land?p.left+p.width/2:innerWidth/2, ty=land?p.top+p.height/2:innerHeight/2;
  const bw=land?p.width*.86:innerWidth*.88, bh=land?p.height*.86:innerHeight*.82;
  const sc=Math.min(bw/lw,bh/lh);
  letter.style.transform=`translate(${tx-bx}px,${ty-by}px) scale(${sc}) rotate(0deg)`;
}
function lift(){lifted=true;letter.classList.add('lifted');pageL.classList.add('top');veil.classList.add('on');placeLetter(true)}
function tuck(){lifted=false;letter.classList.remove('lifted');veil.classList.remove('on');placeLetter(false);setTimeout(()=>{if(!lifted)pageL.classList.remove('top')},700)}
letter.addEventListener('click',e=>{e.stopPropagation();lifted?tuck():lift()});
letter.addEventListener('keydown',e=>{if(e.key==='Enter'){lifted?tuck():lift()}});
veil.addEventListener('click',tuck);

// ---- candles
const fl=[$('fl0'),$('fl1')];
let lit=true,blow=0,held=false,spaceHeld=false,level=0,fallbackLevel=0;
const BLOW_TIME=.7,THRESH=.12;
$('mark').style.left=(THRESH/.4*100)+'%';
function puff(f){
  const s=document.createElement('div');s.className='smoke';
  s.style.left=(parseFloat(f.style.left)+parseFloat(f.style.width)*.4)+'%';
  s.style.top=(parseFloat(f.style.top)+parseFloat(f.style.height)*.5)+'%';
  $('pageR').appendChild(s);setTimeout(()=>s.remove(),2300);
}
function extinguish(){
  lit=false;blow=0;
  fl.forEach((f,i)=>setTimeout(()=>{f.classList.add('out');puff(f);puff(f)},i*260));
  $('msg').textContent='Nice breath!';
  setTimeout(()=>{$('wish').classList.add('on');burst()},1100);
}
function relight(){
  lit=true;blow=0;$('wish').classList.remove('on');
  fl.forEach(f=>{f.classList.remove('out');f.firstElementChild.style.transform=''});
  $('msg').textContent=micOn?'Blow on your mic.':'Hold the button / Space.';
}
$('again').onclick=relight;

// ---- mic
let micOn=false,an=null,td=null,fd=null;
async function enableMic(){
  const msg=$('msg');
  if(!navigator.mediaDevices||!navigator.mediaDevices.getUserMedia||!window.isSecureContext){
    msg.textContent='Mic needs https. Use Hold to blow or Space.';return}
  try{
    msg.textContent='Waiting for mic permission…';
    const st=await navigator.mediaDevices.getUserMedia({audio:{echoCancellation:false,noiseSuppression:false,autoGainControl:false}});
    const ctx=new (window.AudioContext||window.webkitAudioContext)();await ctx.resume();
    const src=ctx.createMediaStreamSource(st);an=ctx.createAnalyser();an.fftSize=1024;an.smoothingTimeConstant=.3;
    src.connect(an);td=new Float32Array(an.fftSize);fd=new Uint8Array(an.frequencyBinCount);
    micOn=true;$('micBtn').style.display='none';msg.textContent='Mic on. Blow on it!';
  }catch(err){msg.textContent='Mic blocked. Use Hold to blow or Space.'}
}
$('micBtn').onclick=enableMic;
function micLevel(){
  if(!micOn)return{rms:0,low:0};
  an.getFloatTimeDomainData(td);let s=0;for(const v of td)s+=v*v;const rms=Math.sqrt(s/td.length);
  an.getByteFrequencyData(fd);const sr=an.context.sampleRate,bin=sr/an.fftSize;
  let lo=0,all=0;for(let i=1;i<fd.length;i++){const e=fd[i]*fd[i];all+=e;if(i*bin<500)lo+=e}
  return{rms,low:all?lo/all:0};
}
// hold fallback
const hold=$('holdBtn');
['pointerdown'].forEach(t=>hold.addEventListener(t,e=>{held=true;hold.setPointerCapture(e.pointerId)}));
['pointerup','pointercancel','lostpointercapture'].forEach(t=>hold.addEventListener(t,()=>held=false));
addEventListener('keydown',e=>{if(e.code==='Space'&&isOpen){e.preventDefault();spaceHeld=true}});
addEventListener('keyup',e=>{if(e.code==='Space')spaceHeld=false});
addEventListener('blur',()=>{held=spaceHeld=false});

let last=performance.now();
function loop(t){
  const dt=Math.min(.05,(t-last)/1000);last=t;
  const m=micLevel();
  const manual=held||spaceHeld;
  let blowing=false;
  if(manual){fallbackLevel=.22+Math.random()*.08;blowing=true}else fallbackLevel*=.8;
  level=Math.max(m.rms,fallbackLevel);
  if(micOn&&m.rms>THRESH&&m.low>.45)blowing=true;
  $('fill').style.width=Math.min(100,level/.4*100)+'%';
  if(lit){
    blow=blowing?Math.min(1,blow+dt/BLOW_TIME):Math.max(0,blow-dt/.5);
    fl.forEach((f,i)=>{f.firstElementChild.style.transform=`skewX(${blow*-22}deg) scale(${1-blow*.25},${1-blow*.3})`});
    if(blow>=1&&isOpen&&book.classList.contains('ready'))extinguish();
  }
  requestAnimationFrame(loop);
}
requestAnimationFrame(loop);

// ---- confetti
const cv=$('confetti'),cx=cv.getContext('2d');let ps=[],raf=0;
function sizeC(){cv.width=innerWidth*devicePixelRatio;cv.height=innerHeight*devicePixelRatio}
addEventListener('resize',sizeC);sizeC();
function burst(){
  const cols=['#e0777d','#f2b84b','#7bb274','#5b8fd0','#9b3d3a','#fff2d6'];
  const d=devicePixelRatio;
  for(let i=0;i<170;i++){const a=Math.random()*Math.PI*2,sp=6+Math.random()*10;
    ps.push({x:cv.width/2+(Math.random()-.5)*cv.width*.3,y:cv.height*.4,vx:Math.cos(a)*sp*d,vy:(Math.sin(a)*sp-7)*d,w:(5+Math.random()*6)*d,h:(8+Math.random()*8)*d,r:Math.random()*6,vr:(Math.random()-.5)*.4,c:cols[i%cols.length],life:1})}
  if(!raf)raf=requestAnimationFrame(stepC);
}
function stepC(){
  cx.clearRect(0,0,cv.width,cv.height);
  ps.forEach(p=>{p.vy+=.35*devicePixelRatio;p.vx*=.992;p.x+=p.vx;p.y+=p.vy;p.r+=p.vr;p.life-=.0045;
    cx.save();cx.globalAlpha=Math.max(0,p.life);cx.translate(p.x,p.y);cx.rotate(p.r);cx.fillStyle=p.c;cx.fillRect(-p.w/2,-p.h/2,p.w,p.h);cx.restore()});
  ps=ps.filter(p=>p.life>0&&p.y<cv.height+40);
  raf=ps.length?requestAnimationFrame(stepC):0;
}
